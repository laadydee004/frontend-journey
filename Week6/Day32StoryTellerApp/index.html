<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storytelling App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="storyContainer">
        <div>
            <h1 class="mainTitle">Want to hear a short story?</h1>
            <div>
                <div class="borderContainer">
                    <div class="maincontent">
                        <div class="storyHead">
                            <button class="btn" id="scary-btn">Scary Story</button>
                            <button class="btn" id="funny-btn">Funny Story</button>
                            <button class="btn" id="adventure-btn">Adventure Story</button> 
                        </div> 
                        <div>
                            <p class="result" id="result"></p>
                        </div> 
                     </div>
                </div>
            </div>
        </div>
    </main>
    
    <script src="./index.js"></script>
</body>
</html>
