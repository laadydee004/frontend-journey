<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day33Emoji Reactor</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="main-container">
        <div>
            <h1>How are you feeling today?</h1>
      <h2 class="description">Click on the buttons below to rate your emotions.</h2>
        </div>
        <div class="allBtn">
            <div class="btn-container">
                <button id="happy-btn" class="emoji-btn" aria-label="Happy face emoji"> <span role="img" aria-hidden="true">😊 </span><span class="count">0/10</span></button>
                <button id="confused-btn" class="emoji-btn">😕 </span><span class="count">0/10</span></button>
                <button id="sad-btn" class="emoji-btn"><span>😠</span> <span class="count">0/10</span></button>
                <button id="loving-btn" class="emoji-btn"><span>😍</span> <span class="count">0/10</span></button>
            </div>
        </div>
    </main>




    <script src="./index.js"></script>
</body>
</html>
