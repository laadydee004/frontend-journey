<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build a Music Instrument Filter</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="all-instruments">
        <h1>Student Instruments</h1>
        <select name="" id="select-menu" class="selectMenu">
            <option value="all" id="all">All</option>
            <option value="woodwinds" id="woodwinds">Woodwinds</option>
            <option value="brass" id="brass">Brass</option>
            <option value="percussion" id="percussion">Percussion</option>
        </select>
        <div class="products-container">
            <div class="Instruments">
                <p>Flute <span>$500</span></p>
                <p>Clarinet <span>$200</span></p>
                <p>Oboe <span>$4000</span></p>
                <p>Trumpet <span>$200</span></p>
            </div>
            <div class="Instruments">
                <p>Trombone <span>$300</span></p>
                <p>French Horn <span>$4300</span></p>
                <p>Drum Set <span>$500</span></p>
                <p>Xylophone <span>$3000</span></p>
            </div>
            <div class="Instruments">
                <p>Cymbals <span>$200</span></p>
                <p>Marimba <span>$3000</span></p>
            </div>
        </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
